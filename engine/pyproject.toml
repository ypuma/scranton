[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "scranton-pipeline"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["langgraph==1.2.20", "langgraph-checkpoint==4.3.1", "langgraph-checkpoint-sqlite==3.1.3", "langchain-core==1.7.6", "langchain-openai==1.7.4", "pydantic==2.14.3"]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "ruff==0.17.4", "mypy==2.4.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
scranton_pipeline = ["sandbox_image/Dockerfile", "sandbox_image/.dockerignore", "procedure/default.json", "evals/packs/core/pack.json", "evals/packs/core/refiner.json", "evals/packs/core/fixture/*.py", "evals/packs/core/green/*.py", "evals/packs/core/turns/*/*.json"]
